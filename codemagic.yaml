workflows:
  android-workflow:
    name: Android APK & AAB Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Set Android SDK & Environment Files
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
      - name: Make Gradle Wrapper Executable
        script: |
          chmod +x gradlew
      - name: Build Debug and Release APK
        script: |
          ./gradlew assembleDebug assembleRelease --no-daemon
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - shankor199517@gmail.com
        notify:
          success: true
          failure: false
