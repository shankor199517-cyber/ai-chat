workflows:
  android-workflow:
    name: Android APK & AAB Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Set Android SDK & Environment Files
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -D debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Prepare Gradle Wrapper
        script: |
          chmod +x gradlew
          if ! jar tf gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -q "GradleWrapperMain"; then
            echo "⚠️ gradle-wrapper.jar is missing or invalid. Regenerating Gradle Wrapper..."
            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 9.3.1
            fi
          fi
      - name: Build Debug and Release APK
        script: |
          chmod +x gradlew
          if ./gradlew assembleDebug assembleRelease --no-daemon; then
            echo "✅ Build completed with gradlew"
          else
            echo "⚠️ gradlew failed, building with system gradle..."
            gradle assembleDebug assembleRelease --no-daemon
          fi
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - shankor199517@gmail.com
        notify:
          success: true
          failure: false
